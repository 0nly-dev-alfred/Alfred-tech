<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Alfred Tech Academy</title>
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Segoe UI', sans-serif;
        }

        body { 
            background-color: #0f172a; color: #f8fafc;
            min-height: 100vh; overflow-x: hidden;
        }

        /* --- NAVBAR --- */
        .navbar { 
            position: fixed; top: 0; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 10%; background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid #334155; 
        }

        .nav-logo a { 
            font-size: 1.5rem; font-weight: bold; color: white; 
            text-decoration: none; letter-spacing: 1px; 
        }

        .nav-logo span { color: #ff00ff; }

        .nav-right {
            display: flex; align-items: center; gap: 15px;
        }

        .nav-username {
            color: #94a3b8; font-size: 0.9rem;
        }

        .nav-username span { color: #ff00ff; font-weight: bold; }

        .btn-logout {
            background: transparent; color: #ef4444;
            border: 1px solid #ef4444; padding: 6px 14px;
            border-radius: 6px; font-size: 0.85rem; font-weight: bold;
            cursor: pointer; transition: background 0.3s;
        }

        .btn-logout:hover { background: rgba(239, 68, 68, 0.1); }

        /* --- MAIN CONTENT --- */
        .main { 
            max-width: 1000px; width: 90%; 
            margin: 120px auto 80px; 
        }

        /* --- WELCOME BANNER --- */
        .welcome-banner {
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.15), rgba(0, 210, 255, 0.1));
            border: 1px solid rgba(255, 0, 255, 0.2);
            border-radius: 16px; padding: 35px;
            margin-bottom: 30px;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 20px;
        }

        .welcome-banner h1 {
            font-size: 2rem; margin-bottom: 8px;
            background: linear-gradient(90deg, #ff00ff, #00d2ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .welcome-banner p { color: #94a3b8; font-size: 0.95rem; }

        .btn-edit-profile {
            text-decoration: none; color: white;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #334155; padding: 10px 20px;
            border-radius: 8px; font-size: 0.85rem; font-weight: bold;
            transition: border-color 0.3s, background 0.3s; white-space: nowrap;
        }

        .btn-edit-profile:hover { border-color: #ff00ff; background: rgba(255, 0, 255, 0.05); }

        /* --- CARDS GRID --- */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px; margin-bottom: 30px;
        }

        .info-card {
            background: #1e293b; border-radius: 12px;
            padding: 25px; border: 1px solid #334155;
            transition: border-color 0.3s;
        }

        .info-card:hover { border-color: #ff00ff; }

        .info-card .card-label {
            font-size: 0.7rem; text-transform: uppercase;
            letter-spacing: 1.5px; color: #64748b; margin-bottom: 10px;
        }

        .info-card .card-value {
            font-size: 1.1rem; font-weight: bold; color: #f8fafc;
        }

        .info-card .card-icon { font-size: 1.5rem; margin-bottom: 12px; display: block; }

        /* --- PROFILE SECTION --- */
        .profile-section {
            background: #1e293b; border-radius: 12px;
            padding: 30px; border: 1px solid #334155;
        }

        .profile-section h2 {
            font-size: 1.2rem; margin-bottom: 20px; color: #ff00ff;
            text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem;
        }

        .profile-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .profile-field label {
            display: block; font-size: 0.8rem; color: #64748b;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;
        }

        .profile-field p {
            font-size: 0.95rem; color: #f8fafc;
            background: #0f172a; padding: 10px 14px;
            border-radius: 6px; border: 1px solid #334155;
        }

        @media (max-width: 768px) {
            .navbar { padding: 15px 5%; flex-direction: column; gap: 15px; }
            .cards-grid { grid-template-columns: 1fr; }
            .profile-grid { grid-template-columns: 1fr; }
            .main { margin-top: 160px; }
        }

        @media (max-width: 992px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">
            <a href="index.html">ALFRED TECH<span>ACADEMY</span></a>
        </div>
        <div class="nav-right">
            <span class="nav-username">Hi, <span id="nav-name">Student</span></span>
            <button class="btn-logout" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="main">

        <div class="welcome-banner">
            <div>
                <h1 id="welcome-title">Welcome back!</h1>
                <p id="welcome-sub">Here's your student portal overview.</p>
            </div>
            <a href="profile.html" class="btn-edit-profile">✏️ Edit Profile</a>
        </div>

        <div class="cards-grid">
            <div class="info-card">
                <span class="card-icon">🎓</span>
                <div class="card-label">Enrolled Track</div>
                <div class="card-value" id="card-course">—</div>
            </div>
            <div class="info-card">
                <span class="card-icon">📍</span>
                <div class="card-label">Location</div>
                <div class="card-value" id="card-location">—</div>
            </div>
            <div class="info-card">
                <span class="card-icon">📞</span>
                <div class="card-label">Phone</div>
                <div class="card-value" id="card-phone">—</div>
            </div>
        </div>

        <div class="profile-section">
            <h2>Profile Details</h2>
            <div class="profile-grid">
                <div class="profile-field">
                    <label>Full Name</label>
                    <p id="detail-name">—</p>
                </div>
                <div class="profile-field">
                    <label>Email Address</label>
                    <p id="detail-email">—</p>
                </div>
                <div class="profile-field">
                    <label>Phone Number</label>
                    <p id="detail-phone">—</p>
                </div>
                <div class="profile-field">
                    <label>Location</label>
                    <p id="detail-location">—</p>
                </div>
                <div class="profile-field" style="grid-column: 1 / -1;">
                    <label>Bio</label>
                    <p id="detail-bio">—</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- LOAD CURRENT USER ---
        const currentEmail = localStorage.getItem('currentUser');
        const users = JSON.parse(localStorage.getItem('users')) || [];
        const user = users.find(u => u.email === currentEmail);

        if (!user) {
            // Not logged in, redirect to login
            window.location.href = 'login.html';
        } else {
            // Populate navbar
            document.getElementById('nav-name').textContent = user.name.split(' ')[0];

            // Populate welcome banner
            document.getElementById('welcome-title').textContent = `Welcome back, ${user.name.split(' ')[0]}!`;
            document.getElementById('welcome-sub').textContent = `You are enrolled in the ${user.course} track.`;

            // Populate cards
            document.getElementById('card-course').textContent = user.course || '—';
            document.getElementById('card-location').textContent = user.location || 'Not set';
            document.getElementById('card-phone').textContent = user.phone || 'Not set';

            // Populate profile details
            document.getElementById('detail-name').textContent = user.name || '—';
            document.getElementById('detail-email').textContent = user.email || '—';
            document.getElementById('detail-phone').textContent = user.phone || 'Not set';
            document.getElementById('detail-location').textContent = user.location || 'Not set';
            document.getElementById('detail-bio').textContent = user.bio || 'Not set';
        }

        // --- LOGOUT ---
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
